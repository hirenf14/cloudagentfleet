name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # Version comes from package.json "packageManager".
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm 11.5+ publishes through npm trusted publishing (GitHub OIDC, no
      # token to expire) when the packages are configured for this workflow on
      # npmjs.com, and falls back to NODE_AUTH_TOKEN otherwise. setup-node's
      # registry-url writes the npm auth line for that fallback.
      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11.6.2



      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build release packages
        run: pnpm build:release

      - name: Verify npm packs ship build output only
        run: pnpm verify:packs

      - name: Create Release Pull Request or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          version: pnpm changeset version
          publish: pnpm release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signed build provenance on npm (needs id-token: write and a public repo).
          NPM_CONFIG_PROVENANCE: "true"

      # The packages share one version (fixed). Each gets its own GitHub
      # Release; the Worker's is marked Latest so releases/latest/download
      # links (docs, dashboard) resolve, and the archives attach to it.
      - name: Mark the release as Latest
        id: release-version
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/node-agent/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          gh release edit "@cloudagentfleet/worker@$version" --latest

  standalone:
    name: Standalone ${{ matrix.name }}
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from package.json "packageManager".
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release runtime
        run: pnpm build:release

      - name: Package standalone archives (hub, worker)
        run: pnpm package:standalone

      - name: Upload standalone artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudagentfleet-${{ matrix.name }}
          path: dist/standalone/*.tar.gz

      - name: Attach archives to this version's Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="@cloudagentfleet/worker@${{ needs.release.outputs.version }}"
          shopt -s nullglob
          files=(dist/standalone/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No standalone archives to upload."
            exit 0
          fi
          gh release upload "$tag" "${files[@]}" --clobber
